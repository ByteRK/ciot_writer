plugins {
    id 'com.android.application'
}

// 编译时间与 APK 产物时间戳共用同一次构建时刻，避免两者出现秒级偏差。
def buildMoment = new Date()
def buildTime = buildMoment.format('yyyy-MM-dd HH:mm:ss')
def apkTimestamp = buildMoment.format('yyyyMMdd-HHmmss')

android {
    namespace 'com.ciot.writer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ciot.writer'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        // 编译时间注入 BuildConfig，供设置页「关于」信息展示。
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
    }

    buildFeatures {
        buildConfig true
    }

    // 统一 APK 产物命名：CiotWriter_<debug|release>_V<版本名>_<时间戳>.apk
    applicationVariants.all { variant ->
        def buildType = variant.buildType.name
        def appVersion = variant.versionName
        variant.outputs.all { output ->
            output.outputFileName = "CiotWriter_${buildType}_V${appVersion}_${apkTimestamp}.apk"
        }
    }
}
